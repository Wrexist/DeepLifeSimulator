# Reusable TestFlight deploy pipeline — called from app repos, never run
# directly here. See TESTFLIGHT.md for the full runbook and onboarding
# checklist. App repos call this with a ~30-line caller workflow (copies
# in templates/) and `secrets: inherit`.
#
# Project specifics arrive as inputs; signing always comes from this
# repo's match storage via the same MATCH_* / ASC_* secrets every app
# repo already defines.

name: TestFlight (reusable)

on:
  workflow_call:
    inputs:
      project_type:
        description: 'capacitor | xcodegen | xcodeproj'
        required: true
        type: string
      scheme:
        description: 'Xcode scheme to build (e.g. App, Peptide)'
        required: true
        type: string
      xcode_project:
        description: 'Path to the .xcodeproj, relative to the repo root'
        required: true
        type: string
      bundle_map:
        description: 'JSON object mapping target name -> bundle id, main app first, e.g. {"App": "com.myapp"}'
        required: true
        type: string
      xcode_workspace:
        description: 'Path to a .xcworkspace if the project uses one (CocoaPods). Blank = build the .xcodeproj.'
        required: false
        type: string
        default: ''
      main_bundle_id:
        description: 'Bundle id used for the TestFlight version-regression guard. Blank = first entry of bundle_map.'
        required: false
        type: string
        default: ''
      match_branch:
        description: 'Cert storage branch in the match repo. Defaults to new-apps so new projects never touch the dynasty-manager / Peptide-ai certs on the default branch.'
        required: false
        type: string
        default: 'new-apps'
      marketing_version:
        description: 'Explicit marketing version. Blank = auto <version_line>.<run_number> so every upload is unique.'
        required: false
        type: string
        default: ''
      version_line:
        description: 'Prefix for auto-generated versions when marketing_version is blank'
        required: false
        type: string
        default: '1.0'
      configuration:
        description: 'Build configuration'
        required: false
        type: string
        default: 'Release'
      runner:
        description: 'macOS runner image. Pinned by default — macos-latest drifts when GitHub rotates images.'
        required: false
        type: string
        default: 'macos-15'
      xcode_version:
        description: 'Xcode version for maxim-lobanov/setup-xcode'
        required: false
        type: string
        default: 'latest-stable'
      node_version:
        description: 'Node version (capacitor projects only)'
        required: false
        type: string
        default: '22'
      web_build_command:
        description: 'Command that produces the web bundle (capacitor projects only)'
        required: false
        type: string
        default: 'npm run build'
      pre_build_script:
        description: 'Optional project hook, run before the web build / project generation (if the file exists)'
        required: false
        type: string
        default: 'scripts/testflight-prebuild.sh'
      post_sync_script:
        description: 'Optional project hook, run after cap sync / xcodegen, before signing (if the file exists)'
        required: false
        type: string
        default: 'scripts/testflight-postsync.sh'
      app_icon_path:
        description: 'Path to the 1024pt App Store icon PNG. If set, its alpha channel is stripped (Apple rejects alpha).'
        required: false
        type: string
        default: ''
      set_encryption_exemption:
        description: 'Stamp ITSAppUsesNonExemptEncryption=false so builds skip the manual compliance question. Set false if the app ships non-exempt crypto.'
        required: false
        type: boolean
        default: true
      timeout_minutes:
        description: 'Job timeout'
        required: false
        type: number
        default: 45
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_KEY_P8:
        required: true
      MATCH_GIT_URL:
        required: true
      MATCH_PASSWORD:
        required: true
      MATCH_SSH_PRIVATE_KEY:
        required: true
      APP_ENV:
        description: 'Optional KEY=VALUE lines exported into the build env (web build + hook scripts)'
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v4

      # The generic Fastfile + Gemfile live in the certificates repo. The
      # match deploy key every app repo already holds grants read access.
      - name: Check out deploy kit (ios-certificates)
        uses: actions/checkout@v4
        with:
          repository: Wrexist/ios-certificates
          ref: master
          ssh-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
          path: .testflight-kit

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: .testflight-kit

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      - name: Trust GitHub SSH host key
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Resolve marketing version + build number
        env:
          INPUT_VERSION: ${{ inputs.marketing_version }}
          VERSION_LINE: ${{ inputs.version_line }}
          BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$INPUT_VERSION" ]; then
            # run_number only ever increases, so <line>.<run_number> is
            # always unique and always sorts above the previous auto build.
            NEW_VERSION="${VERSION_LINE}.${BUILD}"
            echo "No marketing_version input — defaulting to ${NEW_VERSION}."
          else
            NEW_VERSION="$INPUT_VERSION"
            echo "Using marketing_version input: ${NEW_VERSION}"
          fi

          # Apple accepts only numeric-dot strings: MAJOR.MINOR[.PATCH].
          if ! printf '%s' "$NEW_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::Marketing version '$NEW_VERSION' is not a valid MAJOR.MINOR[.PATCH] string."
            exit 1
          fi

          echo "MARKETING_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "::notice::Shipping marketing_version=${NEW_VERSION} build=${BUILD}"

      # Project-specific build secrets travel in one optional APP_ENV
      # secret holding KEY=VALUE lines. Values are trimmed (a trailing
      # newline pasted into a GitHub secret once cost days of 401
      # debugging), masked, then exported to all later steps.
      - name: Export app-specific env (APP_ENV secret)
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -z "$APP_ENV" ]; then
            echo "No APP_ENV secret — skipping."
            exit 0
          fi
          while IFS= read -r line; do
            case "$line" in ''|\#*) continue ;; esac
            key="${line%%=*}"
            value="${line#*=}"
            key=$(printf '%s' "$key" | awk '{ gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print }')
            value=$(printf '%s' "$value" | awk '{ gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print }')
            [ -z "$key" ] && continue
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            echo "exported $key (${#value} bytes)"
          done <<< "$APP_ENV"

      - uses: actions/setup-node@v4
        if: inputs.project_type == 'capacitor'
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install npm dependencies
        if: inputs.project_type == 'capacitor'
        run: npm ci

      - name: Project pre-build hook
        env:
          PRE_BUILD_SCRIPT: ${{ inputs.pre_build_script }}
        run: |
          if [ -f "$PRE_BUILD_SCRIPT" ]; then
            echo "Running $PRE_BUILD_SCRIPT"
            bash -e "$PRE_BUILD_SCRIPT"
          else
            echo "No pre-build script at $PRE_BUILD_SCRIPT — skipping."
          fi

      - name: Build web bundle + sync Capacitor iOS
        if: inputs.project_type == 'capacitor'
        env:
          WEB_BUILD_COMMAND: ${{ inputs.web_build_command }}
        run: |
          bash -ec "$WEB_BUILD_COMMAND"
          npx cap sync ios

      - name: Generate Xcode project (XcodeGen)
        if: inputs.project_type == 'xcodegen'
        run: |
          if ! command -v xcodegen &>/dev/null; then
            brew install xcodegen || brew reinstall xcodegen
          fi
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix)/bin:$PATH"
          if ! command -v xcodegen &>/dev/null; then
            echo "::error::xcodegen still not on PATH after install"
            exit 1
          fi
          echo "XcodeGen ready: $(xcodegen --version)"
          xcodegen generate

      - name: Install CocoaPods (when a workspace is used)
        if: inputs.xcode_workspace != ''
        env:
          WORKSPACE: ${{ inputs.xcode_workspace }}
        run: |
          PODFILE_DIR=$(dirname "$WORKSPACE")
          if [ -f "$PODFILE_DIR/Podfile" ]; then
            (cd "$PODFILE_DIR" && pod install)
          else
            echo "No Podfile next to $WORKSPACE — skipping pod install."
          fi

      - name: Project post-sync hook
        env:
          POST_SYNC_SCRIPT: ${{ inputs.post_sync_script }}
        run: |
          if [ -f "$POST_SYNC_SCRIPT" ]; then
            echo "Running $POST_SYNC_SCRIPT"
            bash -e "$POST_SYNC_SCRIPT"
          else
            echo "No post-sync script at $POST_SYNC_SCRIPT — skipping."
          fi

      # Belt-and-suspenders version pinning: stamp literal values into
      # every bundle Info.plist on disk. The Fastfile additionally passes
      # MARKETING_VERSION / CURRENT_PROJECT_VERSION through xcargs, which
      # covers targets whose Info.plist is generated by Xcode.
      - name: Stamp version, build number and compliance into bundle plists
        env:
          SET_ENCRYPTION_EXEMPTION: ${{ inputs.set_encryption_exemption }}
        run: |
          PLISTS=()
          while IFS= read -r line; do
            PLISTS+=("$line")
          done < <(find . \
            \( -name node_modules -o -name Pods -o -name .testflight-kit \
               -o -name build -o -name DerivedData -o -name .build \
               -o -name vendor -o -name .git \) -prune -false \
            -o -name 'Info.plist' -type f -print | sort)

          if [ "${#PLISTS[@]}" -eq 0 ]; then
            echo "No Info.plist files found on disk — relying on xcargs (generated-plist project)."
            exit 0
          fi

          for PLIST in "${PLISTS[@]}"; do
            # Skip plists that aren't bundle Info.plists (no CFBundleIdentifier).
            if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" >/dev/null 2>&1; then
              echo "Skipping non-bundle plist: $PLIST"
              continue
            fi
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" "$PLIST"
            if [ "$SET_ENCRYPTION_EXEMPTION" = "true" ]; then
              /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
            fi
            echo "Stamped $PLIST → short=$MARKETING_VERSION build=$BUILD_NUMBER"
          done

          echo ""
          echo "=== Final versions in every bundle Info.plist ==="
          for PLIST in "${PLISTS[@]}"; do
            SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null || echo "(missing)")
            BUILDV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" 2>/dev/null || echo "(missing)")
            echo "  $PLIST → short=$SHORT build=$BUILDV"
          done

      - name: Strip alpha channel from App Store icon
        if: inputs.app_icon_path != ''
        env:
          ICON: ${{ inputs.app_icon_path }}
        run: |
          if [ ! -f "$ICON" ]; then
            echo "::error::app_icon_path '$ICON' does not exist."
            exit 1
          fi
          sips -s format jpeg -s formatOptions 100 "$ICON" --out "$ICON.jpg"
          sips -s format png "$ICON.jpg" --out "$ICON"
          rm -f "$ICON.jpg"

      - name: Build, sign and upload to TestFlight
        working-directory: .testflight-kit
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TF_MATCH_BRANCH: ${{ inputs.match_branch }}
          TF_BUNDLE_MAP: ${{ inputs.bundle_map }}
          TF_MAIN_BUNDLE_ID: ${{ inputs.main_bundle_id }}
          TF_SCHEME: ${{ inputs.scheme }}
          TF_CONFIGURATION: ${{ inputs.configuration }}
          TF_XCODE_PROJECT: ${{ github.workspace }}/${{ inputs.xcode_project }}
          TF_XCODE_WORKSPACE: ${{ inputs.xcode_workspace != '' && format('{0}/{1}', github.workspace, inputs.xcode_workspace) || '' }}
          TF_ENCRYPTION_EXEMPT: ${{ inputs.set_encryption_exemption }}
        run: bundle exec fastlane ios beta

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ~/Library/Logs/gym
          if-no-files-found: ignore

      - name: Run summary
        env:
          BUNDLE_MAP: ${{ inputs.bundle_map }}
        run: |
          {
            echo "## TestFlight upload ✅"
            echo ""
            echo "- Version: **${MARKETING_VERSION}** (build **${BUILD_NUMBER}**)"
            echo "- Targets: \`${BUNDLE_MAP}\`"
            echo ""
            echo "The build appears in App Store Connect → TestFlight once Apple"
            echo "finishes processing (usually 5–15 minutes), then updates on"
            echo "testers' phones via the TestFlight app."
          } >> "$GITHUB_STEP_SUMMARY"
