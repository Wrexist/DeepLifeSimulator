<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deep Life Simulator: Tycoon — Get the game</title>
<meta name="description" content="Career, crime, stocks and property. Build a fortune, then pass it on. Free on Google Play and the App Store." />
<meta name="theme-color" content="#0F172A" />
<!--
  THE SHARE LINK. Every in-game share ends in this page's URL
  (lib/config/appConfig.ts -> SHARE_LANDING_URL), because the READER's phone
  decides which store they need, not the sharer's. It sends Android to Google
  Play and iOS to the App Store, and shows both buttons anywhere else.

  The address is compiled into shipped binaries and pasted into messages that
  live forever: this file must never move. Its contents can change freely.
  __tests__/social/shareLinks.test.ts pins both store destinations.

  Link previews (WhatsApp, Discord, iMessage, X) are built from the tags below
  by crawlers that do not run JavaScript, so they always get the card, never a
  redirect. Image URLs must be ABSOLUTE for that reason.
-->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Deep Life Simulator" />
<meta property="og:title" content="Deep Life Simulator: Tycoon" />
<meta property="og:description" content="Live a thousand lives. Career, crime, stocks and property — build a fortune, then pass it on." />
<meta property="og:image" content="https://wrexist.github.io/DeepLifeSimulator/assets/og-share.png" />
<meta property="og:image:width" content="1024" />
<meta property="og:image:height" content="500" />
<meta property="og:url" content="https://wrexist.github.io/DeepLifeSimulator/get/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Deep Life Simulator: Tycoon" />
<meta name="twitter:description" content="Live a thousand lives. Career, crime, stocks and property — build a fortune, then pass it on." />
<meta name="twitter:image" content="https://wrexist.github.io/DeepLifeSimulator/assets/og-share.png" />
<link rel="icon" href="../assets/icon.png" />
<style>
:root{--bg:#0F172A;--card:rgba(30,41,59,.72);--stroke:rgba(148,163,184,.18);--ink:#E2E8F0;--muted:#94A3B8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);line-height:1.5;
  background:radial-gradient(900px 600px at 15% -10%,rgba(99,102,241,.30),transparent 60%),
             radial-gradient(900px 640px at 95% 5%,rgba(139,92,246,.24),transparent 60%),
             linear-gradient(180deg,#0B1120,#0F172A 45%,#0B1120);}
main{width:100%;max-width:420px;text-align:center;background:var(--card);border:1px solid var(--stroke);
  border-radius:24px;padding:32px 24px}
.icon{width:96px;height:96px;border-radius:22px;margin:0 auto 18px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
p.lead{color:var(--muted);font-size:15px;margin-bottom:24px}
.stores{display:flex;flex-direction:column;gap:12px}
.store{display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 18px;border-radius:14px;
  background:#000;border:1px solid #2a2a33;color:#fff;text-decoration:none;font-weight:700;font-size:17px}
.store small{display:block;font-size:11px;font-weight:500;color:#bbb;line-height:1.1;text-align:left}
.store span{text-align:left;line-height:1.15}
.store svg{width:26px;height:26px;flex:none}
.store.primary{border-color:#818CF8;box-shadow:0 0 0 1px rgba(129,140,248,.35)}
.status{margin-top:18px;font-size:13px;color:var(--muted);min-height:1.5em}
</style>
</head>
<body>
<main>
  <img class="icon" src="../assets/icon.png" alt="" width="96" height="96" />
  <h1>Deep Life Simulator: Tycoon</h1>
  <p class="lead">Live a thousand lives. Career, crime, stocks and property — build a fortune, then pass it on. Free to play.</p>
  <div class="stores">
    <a class="store" id="play" href="https://play.google.com/store/apps/details?id=com.deeplife.simulator">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.6 2.2 13.4 12 3.6 21.8c-.4-.2-.6-.7-.6-1.2V3.4c0-.5.2-1 .6-1.2z"/><path fill="#FBBC04" d="m16.7 15.3-3.3-3.3 3.3-3.3 3.8 2.2c1 .6 1 1.6 0 2.2z"/><path fill="#EA4335" d="M16.7 15.3 13.4 12l-9.8 9.8c.4.2.9.2 1.4-.1z"/><path fill="#4285F4" d="M16.7 8.7 5 2.3c-.5-.3-1-.3-1.4-.1L13.4 12z"/></svg>
      <span><small>GET IT ON</small>Google Play</span>
    </a>
    <a class="store" id="ios" href="https://apps.apple.com/us/app/deep-life-simulator/id6749675615">
      <svg viewBox="0 0 384 512" aria-hidden="true"><path fill="#fff" d="M318.7 268c-.3-37 16.4-65 50.1-85.6-18.8-27-47.2-41.8-84.7-44.7-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C72.5 139.2 16 174.5 16 246.3c0 21.3 3.9 43.3 11.7 66 10.4 30 47.9 103.7 87 102.5 20.5-.5 35-14.6 61.7-14.6 25.9 0 39.3 14.6 62.1 14.6 39.5-.6 73.4-67.5 83.3-97.6-52.9-25-52.1-73.1-52.1-74.2zM258.6 84.8c16.6-19.7 27.6-47.2 24.6-74.8-23.8 1-52.7 15.9-69.7 35.6-15.4 17.6-28.9 45.4-25.3 72.6 26.5 2 52.3-13.5 70.4-33.4z"/></svg>
      <span><small>Download on the</small>App Store</span>
    </a>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
</main>
<script>
(function () {
  // Where the share came from (?src=obituary). Forwarded to Google Play as the
  // install referrer so Play Console's acquisition report can attribute
  // installs per share surface. Anything that is not lower snake_case is
  // dropped rather than forwarded into a URL.
  var raw = new URLSearchParams(location.search).get('src') || '';
  var src = /^[a-z0-9_]{1,32}$/.test(raw) ? raw : 'share';

  var PLAY = 'https://play.google.com/store/apps/details?id=com.deeplife.simulator' +
    '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=share&utm_campaign=player_share');
  var IOS = 'https://apps.apple.com/us/app/deep-life-simulator/id6749675615';

  document.getElementById('play').href = PLAY;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  // iPadOS 13+ reports itself as a Mac; a touch screen gives it away.
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  var status = document.getElementById('status');
  if (isAndroid) {
    document.getElementById('play').className += ' primary';
    status.textContent = 'Opening Google Play…';
    location.replace(PLAY); // replace, so Back does not bounce the reader here again
  } else if (isIOS) {
    document.getElementById('ios').className += ' primary';
    status.textContent = 'Opening the App Store…';
    location.replace(IOS);
  }
})();
</script>
</body>
</html>
