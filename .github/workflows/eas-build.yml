name: EAS Build

on:
  # Manual-only: native builds consume EAS build credits and should not run on
  # every merge to main (that exhausted the Expo Free-plan quota and turned the
  # pipeline red). Trigger a release build by hand from the Actions tab instead.
  # OTA JS updates still ship automatically via eas-update.yml on push to main.
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version to ship (e.g. 2.5.3). Apple rejects a version that was already released — bump it for every store release.'
        type: string
        # Required with no default: forces an explicit choice on every run, so
        # a stale package.json version can never be submitted by accident.
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo/EAS login
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run Expo Doctor
        run: npx --yes expo-doctor

      # R9 P1-10: fast-fail on expo-router route conflicts. Production silently
      # DROPS conflicting routes (dev-only error) — this is exactly how the v2.5.0
      # launch crash shipped (app/index.tsx vs app/(tabs)/index.tsx both at "/").
      - name: Route conflict check
        run: npm run check:routes

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # R7 Phase 0: Run startup smoke tests FIRST as a fast-fail gate.
      # These check every (tabs)/* and (onboarding)/* screen has a valid
      # default export and that React.lazy() isn't reintroduced (R6 lesson —
      # crashed prod iOS Hermes bundle). Catching this here saves the full
      # ~10-minute test run when a screen import is broken.
      - name: Startup smoke tests (screen imports, default-export, no lazy)
        run: npm test -- __tests__/startup --ci

      - name: Test
        run: npm test -- --ci

      # R9 P1-10: enforce revenue-critical production config (IAP verify URL, real
      # AdMob unit IDs vs Google test IDs, save-signing) BEFORE building. These
      # checks live only in scripts/preflight-check.js and were never run in CI, so
      # a missing EAS secret would silently ship (purchases refused at runtime /
      # test ads = zero revenue). Non-blocking for now (continue-on-error) so it
      # surfaces issues without breaking a pipeline that uses EAS-hosted env;
      # mirror the values below into GitHub Actions secrets and then remove
      # `continue-on-error` to make this a hard gate.
      - name: Preflight (production config)
        continue-on-error: true
        run: node scripts/preflight-check.js --platform ${{ matrix.platform }}
        env:
          EXPO_PUBLIC_ENABLE_ADMOB: 'true'
          EXPO_PUBLIC_ENABLE_IAP: 'true'
          EXPO_PUBLIC_ENABLE_ATT: 'true'
          EXPO_PUBLIC_IAP_VERIFY_URL: ${{ secrets.EXPO_PUBLIC_IAP_VERIFY_URL }}
          EXPO_PUBLIC_ADMOB_IOS_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_APP_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_APP_ID }}
          EXPO_PUBLIC_ADMOB_BANNER_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_IOS }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS }}
          EXPO_PUBLIC_ADMOB_REWARDED_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_IOS }}
          # Android matrix leg needs its own ad-unit IDs or preflight can't
          # validate Android (it would see Google test IDs and pass spuriously).
          EXPO_PUBLIC_ADMOB_BANNER_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_ANDROID }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID }}
          EXPO_PUBLIC_ADMOB_REWARDED_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_ANDROID }}

      # app.config.js reads expo.version from package.json (single source of
      # truth), so validate and stamp the chosen version there before the
      # project is uploaded to the EAS build queue. Working-tree-only change.
      - name: Set marketing version from workflow input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Version '$VERSION' is not a valid MAJOR.MINOR[.PATCH] string (e.g. 2.5.3)."
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "::notice::expo.version for this build: $(node -p "require('./package.json').version")"

      - name: EAS Build ${{ matrix.platform }}
        run: eas build --platform ${{ matrix.platform }} --profile production --non-interactive
        env:
          # eas-cli's upload-side fingerprint computation crashes with
          # "(0, brace_expansion_1.expand) is not a function" (broken
          # brace-expansion dep inside @expo/fingerprint). Safe to skip:
          # runtimeVersion policy is "sdkVersion" and expo-updates is
          # hard-disabled, so the fingerprint is unused metadata here.
          EAS_SKIP_AUTO_FINGERPRINT: '1'
