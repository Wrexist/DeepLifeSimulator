name: Weekly Routine Audit

# Runs the five routine audits (Economy & Balance, Crash & Stability, Save & State
# Integrity, Game Logic Correctness, Week-Loop Performance) every Monday, plus the
# dynamic performance + economy-conservation test suites. Static audits are fast and
# deterministic; the test step is the dynamic backstop for the perf budget.
#
# Triggers:
#   - schedule: Mondays 07:00 UTC
#   - workflow_dispatch: on demand (with an optional "fail on warnings" toggle)
#   - pull_request touching audited surfaces (fast static audit only, no heavy tests)

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Also run perf + conservation jest suites'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'contexts/game/**'
      - 'lib/economy/**'
      - 'lib/config/gameConstants.ts'
      - 'utils/saveValidation.ts'
      - 'utils/saveMigrations.ts'
      - 'scripts/audit/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Static audits need no dependencies (pure Node), but the dynamic test step does.
      - name: Install dependencies
        run: npm ci

      # Static suite: always runs, writes tasks/weekly-audit-<date>.md, sets step outputs.
      - name: Run static routine audits
        id: audit
        run: node scripts/audit/run-weekly-audit.cjs
        # Don't abort the job on blockers — we still want the report + issue below.
        continue-on-error: true

      # Dynamic backstop: perf timing + money-conservation invariants (scheduled / dispatch).
      - name: Run dynamic audit suites (perf + conservation)
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.run_tests) }}
        run: npm test -- --ci --runInBand __tests__/performance __tests__/stress/moneyConservation.stress.test.ts __tests__/stress/economyFlow.stress.test.ts

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit-report
          path: tasks/weekly-audit-*.md
          if-no-files-found: warn
          retention-days: 90

      # On a scheduled run with blockers, open/update a tracking issue with the report.
      - name: Open tracking issue on failure
        if: ${{ always() && github.event_name == 'schedule' && steps.audit.outputs.blockers != '0' && steps.audit.outputs.blockers != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '${{ steps.audit.outputs.report_path }}';
            let body = 'The weekly routine audit found blocking (critical/high) findings.';
            try { body = fs.readFileSync(reportPath, 'utf8'); } catch {}
            const title = `🔴 Weekly Routine Audit — blockers found (${new Date().toISOString().slice(0,10)})`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'weekly-audit',
            });
            const existing = open.find(i => i.title.startsWith('🔴 Weekly Routine Audit'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `New blockers on ${new Date().toISOString().slice(0,10)}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['weekly-audit'],
              });
            }

      # Surface the static result as the job status (after report/issue handling).
      - name: Enforce audit result
        if: ${{ steps.audit.outcome == 'failure' }}
        run: |
          echo "::error::Weekly routine audit found blocking findings (${{ steps.audit.outputs.blockers }}). See the uploaded report."
          exit 1
