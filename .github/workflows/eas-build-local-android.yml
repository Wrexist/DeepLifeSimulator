name: Android Play Store (local build · no cloud credits)

# Builds the Android app bundle (.aab) with `eas build --local` on a GitHub
# ubuntu runner and (optionally) uploads it to Google Play. Like the iOS sibling
# (.github/workflows/eas-build-local-ios.yml) this consumes ZERO EAS Build
# credits. Unlike iOS, Android compiles on plain ubuntu — no macOS runner — so
# the whole pipeline (gates + build + submit) runs in ONE cheap 1x-billed job.
#
# What you do: open Actions ▸ "Android Play Store (local build · no cloud
# credits)" ▸ Run workflow ▸ type the version ▸ (tick Submit) ▸ Run. That's it.
#
# One-time prerequisites (see docs/RELEASE_SECRETS.md):
#   • EXPO_TOKEN repo secret (same one the iOS workflow uses).
#   • An Android upload keystore registered with EAS — run `eas credentials`
#     once (or let any prior EAS Android build create it). `eas build --local`
#     downloads it from EAS to sign the .aab, exactly like a cloud build.
#   • To auto-upload: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON repo secret (a Google
#     Play service-account key with the "Release apps to testing tracks"
#     permission). Google requires the app's FIRST .aab to be uploaded manually
#     in the Play Console — after that, this workflow's API upload works.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version to ship (e.g. 2.5.9). Bump it for every release so builds are clearly ordered.'
        type: string
        # Required with no default: forces an explicit choice on every run, so a
        # stale package.json version can never be shipped by accident.
        required: true
      submit:
        description: 'Upload the build to Google Play after building'
        type: boolean
        # Safe by default: a Play upload is outward-facing, so it is opt-in —
        # tick this when you actually want to upload. Untick to only produce the
        # .aab artifact (download it and upload by hand as a fallback).
        default: false
      wait_for_submission:
        description: 'Watch the upload until Google Play accepts it (untick to end the run as soon as the binary is handed to EAS)'
        type: boolean
        # On by default: the watch is what turns "scheduled" into "accepted".
        # Unticking does NOT cancel anything — the submission still runs at EAS,
        # you just read the outcome off the Expo dashboard instead of this run.
        default: true
      track:
        description: 'Google Play track to upload to (only used when Submit is ticked)'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        # Internal testing: visible only to your testers, live in minutes, no
        # Google review wait — the safe default. Promote to Production from the
        # Play Console when you're happy, or pick "production" here to go live.
        default: internal
      force_banner:
        description: 'QA ONLY: force the DeepLife+ upsell to show even for premium accounts (do not submit this build to Play)'
        type: boolean
        # Bakes EXPO_PUBLIC_FORCE_DEEPLIFE_UPSELL=true so the banner/badge/pill
        # render for members too — lets you verify them on your own premium
        # account in an internal build. Off for any real release.
        default: false

concurrency:
  group: android-local-release
  cancel-in-progress: false

# Least privilege: this job only reads code, runs EAS, and uploads artifacts.
permissions:
  contents: read
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Already on the 1x runner, so this is not the cost fix the iOS workflow
    # needed — it is only a backstop so a hung build or a stalled Play
    # submission ends in a red job instead of burning to the 6h default.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Fail fast if the requested marketing version isn't a full
      # MAJOR.MINOR.PATCH string — `npm version` (used to stamp package.json
      # below) rejects two-part inputs like "2.5".
      # It also refuses a version LOWER than package.json's current one. That is
      # not pedantry: run #5 was dispatched with "1.4.1" while package.json was
      # "2.8.0". 1.4.x is the APP STORE CONNECT version record, a deliberately
      # different number from the binary version (see CLAUDE.md §9) — but this
      # input stamps package.json, i.e. the BINARY version. Accepting it would
      # have shipped a build that reports itself OLDER than the previous one, so
      # TestFlight/Play/crash reports order it wrong and the "builds must stay
      # distinguishable" rule silently breaks. Equal is allowed (`npm version`
      # runs with --allow-same-version) so you can rebuild the same marketing
      # version with a fresh versionCode.
      - name: Validate marketing version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' must be a full MAJOR.MINOR.PATCH string (e.g. 2.5.9)."
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          CURRENT="$CURRENT" node -e '
            const cmp = (a, b) => {
              const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pa[i] - pb[i];
              return 0;
            };
            const next = process.env.VERSION, current = process.env.CURRENT;
            if (cmp(next, current) < 0) {
              console.log(`::error::Version ${next} is LOWER than package.json current ${current}. This input sets the BINARY version (Android versionName / CFBundleShortVersionString), which must never go backwards. If you meant the App Store Connect version record (the 1.x line shown on the store page), that is a DIFFERENT number and is not set here — see CLAUDE.md section 9. Pick ${current} or higher.`);
              process.exit(1);
            }
          '
          echo "::notice::Building marketing version $VERSION (package.json currently: $CURRENT)"

      # Fail fast if EAS auth is missing, before any dependency install / build.
      - name: Require EXPO_TOKEN
        run: test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN repo secret is not set — add it under Settings ▸ Secrets ▸ Actions"; exit 1; }
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Guardrail: a force-banner build shows the upsell to paying members, so it
      # must never reach Google Play. Refuse the combination up front.
      - name: Refuse to submit a QA force-banner build
        if: ${{ inputs.submit && inputs.force_banner }}
        run: |
          echo "::error::force_banner is a QA-only flag that shows the upsell to premium accounts — it must not be uploaded to Play. Untick Submit (build the .aab and sideload/internal-test it), or untick force_banner for a real release."
          exit 1

      # Fail fast if Submit is ticked but the Play service-account key is missing
      # OR malformed, so we don't spend a whole build only to fail at the upload
      # step. Checking non-empty is not enough: a truncated paste or the wrong
      # JSON file is non-empty, so it would clear this guard, burn the ~40-minute
      # native build, and only then die at "Write Play service-account key". Both
      # the JSON parse and the service-account shape check therefore run HERE;
      # the parse near the submit step stays as a second check on what actually
      # lands on disk.
      - name: Require Play service-account key when submitting
        if: ${{ inputs.submit }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Submit is ticked but the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON repo secret is not set. Either untick Submit (the .aab is still built and uploaded as an artifact you can upload by hand), or add the secret: Play Console > Users & permissions > invite a service account with 'Release apps to testing tracks'; Google Cloud Console > that service account > Keys > Add key > JSON; paste the whole file into GitHub > Settings > Secrets and variables > Actions > New repository secret named GOOGLE_PLAY_SERVICE_ACCOUNT_JSON. See docs/RELEASE_SECRETS.md. Note Google requires this app's FIRST .aab to be uploaded manually in the Play Console before API uploads are allowed."
            exit 1
          fi
          # Validate without echoing the secret: node reads it from the env, and
          # every diagnostic below names only the FIELD at fault, never a value.
          if ! node -e '
            const raw = process.env.SA_JSON;
            let key;
            try {
              key = JSON.parse(raw);
            } catch {
              // Deliberately NOT reporting the parser message: node embeds a
              // snippet of the offending input in it ("Unexpected token h, \"hello
              // world\" is not valid JSON"), which for a credential would print a
              // fragment of the key into the log. Actions masks only the exact
              // secret string, so a fragment would survive masking.
              console.log("::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not valid JSON. Paste the ENTIRE downloaded key file, including the opening and closing braces. (Parser detail withheld — it would echo part of the key.)");
              process.exit(1);
            }
            const missing = ["type", "client_email", "private_key"].filter((f) => !key[f]);
            if (missing.length) {
              console.log("::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON parses as JSON but is missing: " + missing.join(", ") + ". That usually means the wrong file was pasted — this must be the SERVICE ACCOUNT key from Google Cloud Console (Keys > Add key > JSON), not an OAuth client, a Firebase config, or google-services.json.");
              process.exit(1);
            }
            if (key.type !== "service_account") {
              console.log("::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON has type \"" + key.type + "\", expected \"service_account\".");
              process.exit(1);
            }
          '; then
            exit 1
          fi
        env:
          SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: expo/expo-github-action installs the LATEST eas-cli
          # with yarn, and eas-cli's dependency tree now requires Node >=22
          # (@oclif/plugin-autocomplete@3.3.0's engines field). Under Node 20
          # the Expo/EAS login step hard-fails before the build starts
          # (2026-08-25). GitHub runners have also deprecated Node 20.
          node-version: '22'
          cache: 'npm'

      # Android/Gradle needs JDK 17 (Expo SDK 54 / RN 0.81). Pin it explicitly so
      # the build is deterministic regardless of the runner's default JDK, and
      # cache the Gradle downloads to speed up repeat builds.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      # ---- Cheap gates (fail fast before the ~15-min native build) -----------
      - name: Route conflict check
        run: npm run check:routes

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # Revenue-critical / integrity config gate. This IS blocking — save-signing
      # (EXPO_PUBLIC_SAVE_HMAC_KEY), IAP receipt verification, and malformed ad
      # unit IDs all fail the build closed, so a Play upload can never ship with
      # unsigned saves or unverified purchases. The ONLY exception is
      # --warn-missing-android-admob, which downgrades *missing Android AdMob ad
      # units* to a warning (they aren't created yet — iOS-only ad launch). Drop
      # that flag once the Android ad units exist to make ads blocking too.
      - name: Preflight (production config)
        run: node scripts/preflight-check.js --platform android --warn-missing-android-admob
        env:
          EXPO_PUBLIC_ENABLE_ADMOB: 'true'
          EXPO_PUBLIC_ENABLE_IAP: 'true'
          EXPO_PUBLIC_ENABLE_ATT: 'true'
          EXPO_PUBLIC_SAVE_HMAC_KEY: ${{ secrets.EXPO_PUBLIC_SAVE_HMAC_KEY }}
          EXPO_PUBLIC_IAP_VERIFY_URL: ${{ secrets.EXPO_PUBLIC_IAP_VERIFY_URL }}
          EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_APP_ID }}
          EXPO_PUBLIC_ADMOB_BANNER_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_ANDROID }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID }}
          EXPO_PUBLIC_ADMOB_REWARDED_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_ANDROID }}

      # Authenticate eas-cli non-interactively so `eas build --local` can resolve
      # the EAS-managed Android keystore and project secrets while logged in.
      - name: Expo/EAS login
        uses: expo/expo-github-action@v8
        with:
          # No expo-version: nothing here uses the global expo-cli (deprecated,
          # 6.3.10, superseded by `npx expo`) - installing it costs ~25s and a
          # wall of yarn deprecation warnings. Only eas-cli is needed for auth.
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Android versionCode must STRICTLY INCREASE for every Play upload — Google
      # rejects a versionCode it has already seen or one lower than the last. `eas
      # build --local` does NOT auto-increment (remote autoIncrement only runs on
      # EAS cloud builds), so resolve one here.
      #
      # We deliberately DO NOT pass the ASC_* (Apple) secrets here: that script can
      # only look up Apple's build numbers, never Google Play's. With ASC set it
      # would return small iOS build numbers (e.g. 61); if a prior Android upload
      # used the epoch fallback (~1.78e9), the next value would be LOWER and Google
      # would reject it. Without ASC creds the script uses epoch seconds — strictly
      # monotonic, always higher than any small historical versionCode, and under
      # Google's 2.1B ceiling — which is exactly what Android wants. app.config.js
      # bakes it into android.versionCode.
      #
      # NOTE: eas.json sets `cli.appVersionSource: "remote"`, NOT "local" — earlier
      # revisions of this comment claimed "local" and were simply wrong. Do not
      # "correct" eas.json to match: the cloud workflow (eas-build.yml) has no
      # BUILD_NUMBER step and depends on remote + autoIncrement, so flipping it to
      # local would make every cloud build bake app.config.js's "99" fallback.
      # The remote setting does NOT block this path in practice — the iOS sibling
      # submits to TestFlight on this same eas.json and Apple accepts each build,
      # which it would not if BUILD_NUMBER were being ignored and CFBundleVersion
      # repeated. tasks/lessons.md (2026-06-11) prescribes "local"; that specific
      # remedy is stale — the fix that actually stuck was next-build-number.mjs.
      - name: Compute unique versionCode
        run: echo "BUILD_NUMBER=$(node scripts/next-build-number.mjs)" >> "$GITHUB_ENV"

      # app.config.js reads expo.version from package.json (single source of
      # truth), so stamp the chosen version there. --no-git-tag-version keeps this
      # a working-tree-only change; nothing is committed or pushed.
      - name: Set marketing version from workflow input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "::notice::expo.version for this build: $(node -p "require('./package.json').version") (versionCode $BUILD_NUMBER)"

      # --local compiles the .aab on this runner (no cloud credits). --output pins
      # the artifact path so submit/upload are deterministic. EXPO_PUBLIC_* are
      # passed explicitly so Metro embeds them at bundle time even if an EAS
      # project secret is missing. eas.json's production profile builds an
      # app-bundle (:app:bundleRelease), which is what Google Play requires.
      - name: EAS Build Android (local)
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/build/deeplife.aab"
        env:
          # Same fingerprint crash guard as the iOS/cloud workflows: runtimeVersion
          # policy is "sdkVersion" and expo-updates is hard-disabled, so the
          # fingerprint is unused metadata — safe to skip.
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          # Expo prebuild's generated gradle.properties defaults to a 2 GiB heap /
          # 512 MiB metaspace Gradle daemon — too small for this project's
          # lintVitalAnalyzeRelease (build 105 died with "OutOfMemoryError:
          # Metaspace" in the ads/gesture-handler lint tasks after the daemon
          # itself warned it was expiring on Metaspace). GRADLE_OPTS applies to
          # the Gradle client JVM, and the -D system property it carries sets
          # org.gradle.jvmargs for the daemon — overriding the generated
          # gradle.properties without needing the (prebuild-owned) file itself.
          # ubuntu-latest runners have 16 GiB RAM, so 4g/1g is comfortably safe.
          # The inner double quotes matter: gradlew word-splits GRADLE_OPTS (via
          # xargs), so they keep the multi-flag jvmargs value one property.
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"'
          # Consumed by app.config.js → android.versionCode. (eas.json is
          # appVersionSource "remote"; see the note on the versionCode step above.)
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          # QA flag (see the force_banner input): when true, Metro inlines it so
          # the DeepLife+ upsell renders for members too. Empty on real releases.
          EXPO_PUBLIC_FORCE_DEEPLIFE_UPSELL: ${{ inputs.force_banner && 'true' || '' }}
          EXPO_PUBLIC_ENABLE_ADMOB: 'true'
          EXPO_PUBLIC_ENABLE_IAP: 'true'
          EXPO_PUBLIC_ENABLE_ATT: 'true'
          EXPO_PUBLIC_SAVE_HMAC_KEY: ${{ secrets.EXPO_PUBLIC_SAVE_HMAC_KEY }}
          EXPO_PUBLIC_IAP_VERIFY_URL: ${{ secrets.EXPO_PUBLIC_IAP_VERIFY_URL }}
          EXPO_PUBLIC_IAP_VERIFY_TOKEN: ${{ secrets.EXPO_PUBLIC_IAP_VERIFY_TOKEN }}
          EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_APP_ID }}
          EXPO_PUBLIC_ADMOB_BANNER_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_ANDROID }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID }}
          EXPO_PUBLIC_ADMOB_REWARDED_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_ANDROID }}

      # Always keep the .aab, even if submit is skipped/fails — lets you upload
      # manually via the Play Console as a fallback.
      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: deeplife-android-aab
          path: build/deeplife.aab
          if-no-files-found: error
          retention-days: 14

      # `eas submit` reads its Google Play track from the submit profile in
      # eas.json (there is no --track CLI flag), so write the chosen track into
      # the profile at runtime. Working-tree-only; nothing is committed.
      - name: Select Google Play track
        if: ${{ inputs.submit }}
        env:
          TRACK: ${{ inputs.track }}
        run: |
          node -e "const fs=require('fs');const p='eas.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.submit.production.android.track=process.env.TRACK;fs.writeFileSync(p,JSON.stringify(j,null,2));"
          echo "::notice::Uploading to Google Play track: $TRACK"

      # The service-account key authenticates to Google Play. It's written to the
      # path eas.json's android submit profile points at (serviceAccountKeyPath).
      - name: Write Play service-account key
        if: ${{ inputs.submit }}
        env:
          SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SA_JSON" > play-service-account.json
          node -e "JSON.parse(require('fs').readFileSync('play-service-account.json','utf8'))" \
            || { echo '::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not valid JSON'; exit 1; }

      # Submit does NOT consume build credits. Uses submit.production.android from
      # eas.json (serviceAccountKeyPath + the track selected above).
      #
      # SCHEDULE ONLY — see the same pair of steps in eas-build-local-ios.yml.
      # `eas submit` waits by default and prints one spinner line for the whole
      # submission, so a long queue wait is indistinguishable from a hung job.
      # --no-wait ends this step when the .aab has actually reached EAS; the
      # `Submission details: <url>` line it prints first carries the id the
      # watch step needs. The two steps must stay together: --no-wait alone
      # would make a REJECTED upload read as a green release.
      - name: Submit to Google Play
        if: ${{ inputs.submit }}
        run: |
          set -o pipefail
          eas submit \
            --platform android \
            --profile production \
            --path "$GITHUB_WORKSPACE/build/deeplife.aab" \
            --non-interactive \
            --no-wait | tee "$RUNNER_TEMP/submit-android.log"

      # Remove the key from the runner's working tree promptly (runners are
      # ephemeral, but don't leave a credential lying around mid-job). It sits
      # there for a shorter time now: --no-wait means the key is only needed
      # while the submission is being SCHEDULED, and the watch below reads the
      # status from EAS, which needs no Play credential at all.
      - name: Clean up service-account key
        if: ${{ always() && inputs.submit }}
        run: rm -f play-service-account.json

      # The wait, made legible: polls `eas submit:view --json` and prints every
      # state change plus a 2-minute heartbeat. Red on ERRORED/CANCELED with the
      # reason. `success() &&` is load-bearing — a custom `if:` replaces the
      # implicit success check, so without it a failed submit would be followed
      # by a watch reporting on the previous run's submission.
      - name: Watch the Play submission
        if: ${{ success() && inputs.submit && inputs.wait_for_submission }}
        run: |
          node scripts/wait-for-eas-submission.mjs \
            --from-log "$RUNNER_TEMP/submit-android.log" \
            --platform android \
            --timeout-minutes 60

      # Not waiting is a legitimate choice; losing the link is not.
      - name: Submission link (not waiting)
        if: ${{ success() && inputs.submit && !inputs.wait_for_submission }}
        run: |
          node scripts/wait-for-eas-submission.mjs \
            --from-log "$RUNNER_TEMP/submit-android.log" \
            --platform android \
            --link-only
