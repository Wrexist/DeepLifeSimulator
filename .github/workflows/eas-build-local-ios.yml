name: iOS TestFlight (local build · no cloud credits)

# Builds the iOS app with `eas build --local` on a GitHub macOS runner and
# (optionally) submits to TestFlight. Unlike .github/workflows/eas-build.yml
# (which uses Expo's cloud build queue), this consumes ZERO EAS Build credits —
# use it when the monthly cloud quota is exhausted.
#
# Cost note: macOS runner minutes bill ~10x. Cheap gates run on ubuntu first;
# ONLY the compile runs on macOS. Everything else — including the submission —
# runs on ubuntu.
#
# Why submit is its own ubuntu job (2026-08-05): `eas submit` waits on EAS's
# submission queue, and that wait is not work this runner does. Run #50 measured
# it: 17m26s compiling, then 53m15s of a macOS runner idling while EAS talked to
# Apple — a 1h13m job of which 73% was a billed wait at the 10x rate, ~530
# billed minutes for nothing. `eas submit` only needs the .ipa, eas.json and an
# EXPO_TOKEN, none of which require macOS, so it moves to ubuntu and picks the
# binary up from the artifact the build job already uploads. Same wait, same
# pass/fail signal, one tenth the cost.
#
# Why the submission is scheduled and watched separately (2026-08-19): `eas
# submit` waits by default and, while waiting, prints ONE spinner line for the
# whole submission. A run that spent 22 minutes in EAS's queue was therefore
# byte-identical in the log to a wedged one — 28 rows, last line `- Submitting`,
# no way to tell. It now schedules with `--no-wait` (~90 s, and the submission
# id is printed before the wait would have started) and hands the id to
# scripts/wait-for-eas-submission.mjs, which polls `eas submit:view --json` and
# prints every state change plus a two-minute heartbeat. Same wall clock, same
# red-on-rejection signal, but the log says whether it is EAS's queue or the
# App Store Connect upload — and `wait_for_submission: false` skips the watch
# entirely when you do not want to sit through it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version to ship (e.g. 2.5.3). Apple rejects a version that was already released — bump it for every store release.'
        type: string
        # Required with no default: forces an explicit choice on every run, so
        # a stale package.json version can never be submitted by accident
        # ("You've already submitted this version of the app").
        required: true
      submit:
        description: 'Submit the build to TestFlight after building'
        type: boolean
        # Safe by default: TestFlight submission is outward-facing and hard to
        # reverse, so it is opt-in — tick this when you actually want to submit.
        default: false
      wait_for_submission:
        description: 'Watch the submission until App Store Connect accepts it (adds ~10–25 min of waiting; untick to end the run as soon as the binary is handed to EAS)'
        type: boolean
        # On by default: the watch is what turns "scheduled" into "accepted",
        # and a release that reports green on "scheduled" is the failure mode
        # tasks/lessons.md (2026-08-05) warns about. Untick it deliberately when
        # you would rather read the outcome off the Expo dashboard later —
        # unticking does NOT cancel anything, the submission still runs at EAS.
        default: true

concurrency:
  group: ios-local-release
  cancel-in-progress: false

# Least privilege: these jobs only read code, run EAS, and upload artifacts.
permissions:
  contents: read
  actions: read

jobs:
  # ---- Cheap gates on ubuntu (mirrors eas-build.yml) -----------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Fail fast (before any macOS minutes) if the requested marketing
      # version isn't a full MAJOR.MINOR.PATCH string. Three parts required:
      # `npm version` (used to stamp package.json) rejects two-part inputs
      # like "2.5", which would otherwise fail late in the macOS job.
      - name: Validate marketing version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' must be a full MAJOR.MINOR.PATCH string (e.g. 2.5.3)."
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          CURRENT="$CURRENT" node -e '
            const cmp = (a, b) => {
              const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pa[i] - pb[i];
              return 0;
            };
            const next = process.env.VERSION, current = process.env.CURRENT;
            if (cmp(next, current) < 0) {
              console.log(`::error::Version ${next} is LOWER than package.json current ${current}. This input sets the BINARY version (CFBundleShortVersionString), which must never go backwards — Apple orders TestFlight builds by it. If you meant the App Store Connect version record (the 1.x line shown on the store page), that is a DIFFERENT number and is not set here — see CLAUDE.md section 9. Pick ${current} or higher.`);
              process.exit(1);
            }
          '
          echo "::notice::Building marketing version $VERSION (package.json currently: $CURRENT)"

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: expo/expo-github-action installs the LATEST eas-cli
          # with yarn, and eas-cli's dependency tree now requires Node >=22
          # (@oclif/plugin-autocomplete@3.3.0's engines field). Under Node 20
          # the Expo/EAS login step hard-fails before the build starts
          # (2026-08-25). GitHub runners have also deprecated Node 20.
          node-version: '22'
          cache: 'npm'

      # Fail fast on Ubuntu if the EAS auth token is missing, before the
      # build job spends (10x-billed) macOS minutes.
      - name: Require EXPO_TOKEN
        run: test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN repo secret is not set — add it under Settings ▸ Secrets ▸ Actions"; exit 1; }
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Route conflict check
        run: npm run check:routes

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # Hard gate (CLAUDE.md rule #6): enforce revenue-critical + save-signing
      # production config before spending macOS minutes. All five required
      # secrets must be configured as GitHub Actions repo secrets, or this
      # fails — by design. Unlike eas-build.yml this is NOT continue-on-error
      # and DOES include EXPO_PUBLIC_SAVE_HMAC_KEY (check 8).
      - name: Preflight (production config)
        run: node scripts/preflight-check.js --platform ios
        env:
          EXPO_PUBLIC_ENABLE_ADMOB: 'true'
          EXPO_PUBLIC_ENABLE_IAP: 'true'
          EXPO_PUBLIC_ENABLE_ATT: 'true'
          EXPO_PUBLIC_SAVE_HMAC_KEY: ${{ secrets.EXPO_PUBLIC_SAVE_HMAC_KEY }}
          EXPO_PUBLIC_IAP_VERIFY_URL: ${{ secrets.EXPO_PUBLIC_IAP_VERIFY_URL }}
          EXPO_PUBLIC_ADMOB_IOS_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_APP_ID }}
          EXPO_PUBLIC_ADMOB_BANNER_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_IOS }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS }}
          EXPO_PUBLIC_ADMOB_REWARDED_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_IOS }}

  # ---- Expensive COMPILE on macOS (submission is a separate ubuntu job) -----
  build-ios:
    needs: verify
    runs-on: macos-26
    # A hung compile must not sit on a 10x runner until the 6h default. The
    # measured compile is ~17m; 60 covers a cold cache and a slow queue.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: expo/expo-github-action installs the LATEST eas-cli
          # with yarn, and eas-cli's dependency tree now requires Node >=22
          # (@oclif/plugin-autocomplete@3.3.0's engines field). Under Node 20
          # the Expo/EAS login step hard-fails before the build starts
          # (2026-08-25). GitHub runners have also deprecated Node 20.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Authenticates eas-cli non-interactively via EXPO_TOKEN so `eas build
      # --local` can resolve EAS project secrets while logged in. NOTE: the build
      # number is NOT taken from EAS here — see the "Compute unique build number"
      # step below. Remote autoIncrement only runs on EAS *cloud* builds, never
      # on --local, so the version is minted locally via BUILD_NUMBER.
      # NOTE: eas.json actually sets `cli.appVersionSource: "remote"`, not
      # "local" — earlier revisions of this comment said "local" and were wrong.
      # Do not "correct" eas.json: eas-build.yml (cloud) depends on remote +
      # autoIncrement. The remote setting demonstrably does not block this path —
      # this workflow's submit-ios job succeeds against TestFlight, which Apple
      # would refuse if BUILD_NUMBER were ignored and CFBundleVersion repeated.
      - name: Expo/EAS login
        uses: expo/expo-github-action@v8
        with:
          # No expo-version: nothing here uses the global expo-cli (deprecated,
          # 6.3.10, superseded by `npx expo`) - installing it costs ~25s and a
          # wall of yarn deprecation warnings. Only eas-cli is needed for auth.
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --local compiles on this runner (no cloud credits). --output pins the
      # artifact path so submit/upload are deterministic. EXPO_PUBLIC_* are
      # passed explicitly so Metro embeds them at bundle time even if a project
      # secret is missing.
      - name: Show Xcode Version
        run: |
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep Xcode

      # CFBundleVersion must be UNIQUE for every App Store upload — Apple rejects
      # a resubmission of a build number it has already seen ("You've already
      # submitted this build of the app"). `eas build --local` does NOT
      # auto-increment (remote autoIncrement only runs on EAS cloud builds), so
      # resolve it here: scripts/next-build-number.mjs returns one HIGHER than
      # App Store Connect's current highest build (when the ASC_* secrets below
      # are set), else a monotonic epoch fallback. app.config.js bakes it into
      # ios.buildNumber / android.versionCode.
      - name: Compute unique build number (CFBundleVersion)
        run: echo "BUILD_NUMBER=$(node scripts/next-build-number.mjs)" >> "$GITHUB_ENV"
        env:
          # Optional — set these repo secrets to track App Store Connect exactly.
          # Without them the resolver falls back to epoch seconds (still unique).
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      # app.config.js reads expo.version from package.json (single source of
      # truth), so stamp the chosen version there. --no-git-tag-version keeps
      # this a working-tree-only change; nothing is committed or pushed.
      - name: Set marketing version from workflow input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "::notice::expo.version for this build: $(node -p "require('./package.json').version") (build $BUILD_NUMBER)"

      - name: EAS Build iOS (local)
        run: |
          mkdir -p build
          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/build/deeplife.ipa"
        env:
          # Same fingerprint crash as eas-build.yml — see comment there.
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          # Consumed by app.config.js → ios.buildNumber / android.versionCode,
          # and this value is what gets baked into the binary's CFBundleVersion.
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          EXPO_PUBLIC_ENABLE_ADMOB: 'true'
          EXPO_PUBLIC_ENABLE_IAP: 'true'
          EXPO_PUBLIC_ENABLE_ATT: 'true'
          EXPO_PUBLIC_SAVE_HMAC_KEY: ${{ secrets.EXPO_PUBLIC_SAVE_HMAC_KEY }}
          EXPO_PUBLIC_IAP_VERIFY_URL: ${{ secrets.EXPO_PUBLIC_IAP_VERIFY_URL }}
          EXPO_PUBLIC_IAP_VERIFY_TOKEN: ${{ secrets.EXPO_PUBLIC_IAP_VERIFY_TOKEN }}
          EXPO_PUBLIC_ADMOB_IOS_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_APP_ID }}
          EXPO_PUBLIC_ADMOB_BANNER_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_IOS }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS }}
          EXPO_PUBLIC_ADMOB_REWARDED_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_IOS }}

      # Always keep the .ipa, even if submit is skipped/fails — lets you upload
      # manually via Transporter as a fallback.
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: deeplife-ios-ipa
          path: build/deeplife.ipa
          if-no-files-found: error
          retention-days: 14

  # ---- Submit on ubuntu (1x billing) ---------------------------------------
  # Submit does NOT consume EAS build credits, and it does not need macOS: the
  # .ipa is already built, and `eas submit` just hands it to EAS, which uploads
  # it to App Store Connect. Uses submit.production.ios from eas.json (ascAppId
  # + appleTeamId) and an App Store Connect API key stored as EAS credentials
  # (set once: `eas credentials` or `eas submit` interactively), so
  # --non-interactive can reuse it.
  submit-ios:
    needs: build-ios
    if: ${{ inputs.submit }}
    runs-on: ubuntu-latest
    # Backstop only. The watch step owns the real bound (--timeout-minutes) and
    # explains itself when it fires; this is here so a hang in any OTHER step
    # cannot run to the 6h default — at 1x, but still.
    timeout-minutes: 90
    steps:
      # eas.json (the submit profile) and app.config.js (the EAS project id)
      # both come from the repo.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: expo/expo-github-action installs the LATEST eas-cli
          # with yarn, and eas-cli's dependency tree now requires Node >=22
          # (@oclif/plugin-autocomplete@3.3.0's engines field). Under Node 20
          # the Expo/EAS login step hard-fails before the build starts
          # (2026-08-25). GitHub runners have also deprecated Node 20.
          node-version: '22'
          cache: 'npm'

      # eas-cli resolves the project config through the project's own installed
      # `expo`, so the deps are installed even though nothing is compiled here.
      # ~1 minute at 1x — cheap insurance against a release blocked at the last
      # step. (It is a pure file-patcher, safe on Linux, but the podspec
      # postinstall has nothing to do here.)
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Expo/EAS login
        uses: expo/expo-github-action@v8
        with:
          # No expo-version: nothing here uses the global expo-cli (deprecated,
          # 6.3.10, superseded by `npx expo`) - installing it costs ~25s and a
          # wall of yarn deprecation warnings. Only eas-cli is needed for auth.
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The exact binary the macOS job compiled — not a rebuild. Submitting a
      # second compile would produce a different CFBundleVersion and defeat the
      # "Compute unique build number" step's guarantee.
      - name: Download .ipa artifact
        uses: actions/download-artifact@v4
        with:
          name: deeplife-ios-ipa
          path: build

      # SCHEDULE ONLY. --no-wait stops eas-cli blocking here on EAS's queue
      # behind a single spinner line; the step now ends in ~90s, when the .ipa
      # has actually reached EAS. eas-cli prints `Submission details: <url>`
      # BEFORE the wait it is skipping, so the transcript carries the submission
      # id and the watch step below picks it up from there.
      #
      # Bare --no-wait would be a regression on its own — a scheduled-but-
      # rejected submission would read as a green release (tasks/lessons.md,
      # 2026-08-05). It is only safe here because the watch step restores the
      # signal, so the two must stay together.
      - name: Submit to TestFlight
        run: |
          set -o pipefail
          eas submit \
            --platform ios \
            --profile production \
            --path "$GITHUB_WORKSPACE/build/deeplife.ipa" \
            --non-interactive \
            --no-wait | tee "$RUNNER_TEMP/submit-ios.log"

      # The wait, made legible: polls `eas submit:view --json` and prints every
      # state change (IN_QUEUE → IN_PROGRESS → FINISHED) plus a 2-minute
      # heartbeat, so a slow submission never looks like a hung one. Red on
      # ERRORED/CANCELED with Apple's reason — that is the release signal, and
      # it is why this step is on by default.
      #
      # `success() &&` is load-bearing: a custom `if:` REPLACES the implicit
      # success check, so without it a failed submit step would still be
      # followed by a watch reporting on the PREVIOUS run's submission.
      - name: Watch the TestFlight submission
        if: ${{ success() && inputs.wait_for_submission }}
        run: |
          node scripts/wait-for-eas-submission.mjs \
            --from-log "$RUNNER_TEMP/submit-ios.log" \
            --platform ios \
            --timeout-minutes 60

      # Not waiting is a legitimate choice; losing the link is not. Records
      # where the outcome will show up, so the run is still traceable.
      - name: Submission link (not waiting)
        if: ${{ success() && !inputs.wait_for_submission }}
        run: |
          node scripts/wait-for-eas-submission.mjs \
            --from-log "$RUNNER_TEMP/submit-ios.log" \
            --platform ios \
            --link-only
