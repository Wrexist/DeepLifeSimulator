name: Deploy support site

# Publishes support-site/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source = "GitHub Actions".
# Site goes live at https://wrexist.github.io/DeepLifeSimulator/

on:
  push:
    branches: [main]
    paths:
      - 'support-site/**'
      - '.github/workflows/deploy-support-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Actions build type) so the first run doesn't
          # require manually flipping Settings → Pages → Source.
          enablement: true

      - name: Upload support-site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: support-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing (and the other IndexNow engines) that the pages changed, so
      # they are recrawled in hours instead of weeks. ChatGPT search fetches
      # through Bing, so an unindexed page cannot be cited there. The key is
      # public by design: IndexNow proves ownership by fetching the key file
      # (support-site/<key>.txt), and that location limits submissions to URLs
      # under /DeepLifeSimulator/. A failed ping must never fail the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: c2df4c646e8d062856d0aa666d701396
          SITE: https://wrexist.github.io/DeepLifeSimulator/
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' support-site/sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s -c .)
          body=$(jq -n -c --arg key "$INDEXNOW_KEY" --arg loc "${SITE}${INDEXNOW_KEY}.txt" --argjson urls "$urls" \
            '{host:"wrexist.github.io", key:$key, keyLocation:$loc, urlList:$urls}')
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body"
