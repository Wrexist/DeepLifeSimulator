<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0B111C}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js",
            "three/addons/":"/node_modules/three/examples/jsm/"}}
</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Size and yaw come from the query string so one harness serves both the
// contact sheet and the close-ups. A silhouette defect that is two pixels wide
// in a 420px tile is unarguable at 900px, and half the hair problems in this
// asset only ever showed up head-on or from behind.
const q = new URLSearchParams(location.search);
const W = Number(q.get('w') ?? 420), H = Number(q.get('h') ?? 480);
const canvas = document.createElement('canvas');
canvas.width = W; canvas.height = H;
document.body.appendChild(canvas);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(W, H, false);
renderer.setClearColor(new THREE.Color('#0B111C'), 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;

const scene = new THREE.Scene();
// `zoom` and `ty` frame a close-up without moving the head: dolly in and raise
// the target. Judging an eye or a nostril from a 420px bust is guesswork, and
// guesswork about small features is what shipped an iris covering its own
// sclera.
const ZOOM = Number(q.get('zoom') ?? 1);
const TY = Number(q.get('ty') ?? -0.02);
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);
camera.position.set(0, 0.05 + TY, 6.2 / ZOOM);
camera.lookAt(0, TY, 0);

const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x101521);
const panel = (c, i, x, y, z, w, h) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.1),
    new THREE.MeshBasicMaterial({ color: c, side: THREE.BackSide }));
  m.material.color.multiplyScalar(i); m.position.set(x, y, z); m.lookAt(0, 0, 0);
  envScene.add(m);
};
panel(0xfff2e2, 3.4, -4, 3, 4, 6, 6);
panel(0xd6e6ff, 1.5, 5, 0, 2, 5, 6);
panel(0xffffff, 2.2, 0, 2, -5, 7, 5);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(envScene, 0.04).texture;

const key = new THREE.DirectionalLight(0xfff4e8, 0.85); key.position.set(-2.2, 2.6, 3.4);
const fill = new THREE.DirectionalLight(0xbfd4ff, 0.3); fill.position.set(2.8, -0.4, 2.0);
const rim = new THREE.DirectionalLight(0xffffff, 0.45); rim.position.set(0.6, 1.2, -3.2);
scene.add(key, fill, rim, new THREE.AmbientLight(0xffffff, 0.26));

/**
 * The backdrop — a lit sweep rather than a flat fill.
 *
 * A portrait is as much about what is behind the subject as the subject, and a
 * head floating on one colour is the least premium thing that can be in the
 * frame. Drawn first with no depth write so it never occludes the head.
 */
const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShaderMaterial({
    depthWrite: false, depthTest: false,
    uniforms: {
      uTop: { value: new THREE.Color('#1B2436') },
      uBottom: { value: new THREE.Color('#070A10') },
      uGlow: { value: new THREE.Color('#31405C') },
    },
    vertexShader: `
      varying vec2 vXy;
      void main() { vXy = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vXy;
      uniform vec3 uTop, uBottom, uGlow;
      void main() {
        float v = clamp(vXy.y * 0.14 + 0.5, 0.0, 1.0);
        vec3 base = mix(uBottom, uTop, v);
        float d = length(vec2(vXy.x * 0.9, vXy.y - 0.35));
        gl_FragColor = vec4(mix(base, uGlow, 0.72 * exp(-d * d * 0.055)), 1.0);
      }`,
  }),
);
backdrop.position.z = -6;
backdrop.renderOrder = -1;
scene.add(backdrop);

const root = new THREE.Group(); root.position.y = 0.12;
root.rotation.y = Number(q.get('rot') ?? -0.62); scene.add(root);
window.__ok = false;

const gltf = await new GLTFLoader().loadAsync('/assets/models/head_ict.glb');
const parts = {};
gltf.scene.traverse((o) => { if (o.isMesh) parts[o.material?.name ?? '?'] = o; });

const tex = new THREE.TextureLoader();
const load = (p, srgb) => new Promise((r) => tex.load(p, (t) => {
  t.flipY = false; if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; r(t);
}, undefined, () => r(null)));
const [albedo, roughMap, normalMap] = await Promise.all([
  load('/assets/textures/face_albedo.png', true),
  load('/assets/textures/face_roughness.png', false),
  load('/assets/textures/face_normal.png', false),
]);

const SU = {
  uBrowColor: { value: new THREE.Color(0x2a1c14) },
  uBlemish: { value: Number(q.get('blemish') ?? 0.2) },
};

parts.skin.material = (() => {
  const m = new THREE.MeshPhysicalMaterial({
    color: 0xC07E4F, map: albedo, roughnessMap: roughMap, normalMap,
    normalScale: new THREE.Vector2(0.22, 0.22), roughness: 1, metalness: 0,
    clearcoat: 0.05, clearcoatRoughness: 0.7, envMapIntensity: 0.45,
  });
  // Cheap subsurface: skin glows warm where it is thin and seen edge-on — ear
  // rims, nostrils, the edge of the jaw. Without it a smooth head reads as a
  // mannequin, which is exactly what smoothing the pores made it look like.
  // Real SSS needs a second pass; this is a fresnel term and costs nothing.
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, SU);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' +
        'uniform vec3 uBrowColor;\nuniform float uBlemish;\n' +
        'float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }')
      // Eyebrows are PAINTED into the albedo, so without this they are the same
      // near-black on every character — platinum hair over black brows. The
      // roughness map's blue channel is a brow mask baked from the same
      // landmark polylines that painted them.
      .replace('#include <color_fragment>', '#include <color_fragment>\n' +
        (roughMap ? 'vec2 skinRg = texture2D(roughnessMap, vRoughnessMapUv).gb;\n'
          + 'diffuseColor.rgb = mix(diffuseColor.rgb, uBrowColor, skinRg.y * 0.76);\n'
          // Freckles from `genome.blemishes` — see FaceRenderer. The region is
          // read off data already on the head: matte roughness means skin, and
          // the brow mask in blue keeps them off the eyebrows.
          + 'float skinness = smoothstep(0.44, 0.60, skinRg.x) * (1.0 - skinRg.y);\n'
          // A hash, not sines: cells decide which points carry a freckle and
          // jitter decides where in the cell, so no lattice shows. See the note
          // in FaceRenderer — sines were tried three times and failed the same
          // way each time.
          + 'vec2 uvF = vRoughnessMapUv * 380.0;\n'
          + 'vec2 cell = floor(uvF);\n'
          + 'vec2 jit = vec2(hash21(cell + 3.1), hash21(cell + 7.7)) - 0.5;\n'
          + 'float d = length(fract(uvF) - 0.5 - jit * 0.6);\n'
          + 'float freckle = smoothstep(0.34, 0.10, d) * step(0.86, hash21(cell));\n'
          + 'diffuseColor.rgb *= 1.0 - 0.34 * uBlemish * freckle * skinness;\n' : ''))
      .replace('#include <dithering_fragment>',
        '#include <dithering_fragment>\n' +
        'float sss = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), 3.0);\n' +
        'gl_FragColor.rgb += vec3(0.15, 0.045, 0.022) * sss;');
  };
  return m;
})();

// Head bounds in the geometry's own (quantized) space, for the region masks.
//
// From the POSITION ATTRIBUTE, not computeBoundingBox(). three expands a
// computed box over every morph target at full influence, so it returned the
// widest face the rig can reach — extent 3.64 against the neutral head's 2.00.
// Every hair thickness is a fraction of that number and every region edge is
// measured against it, so the whole shell ran 1.8x oversized and the region
// masks were reading coordinates compressed into the middle of their range:
// the mushroom silhouette, and the reason `undercut` and the fades did almost
// nothing. Same trap as the framing box a few dozen lines down.
const gb = new THREE.Box3()
  .setFromBufferAttribute(parts.skin.geometry.getAttribute('position'));
const headMin = new THREE.Vector3().copy(gb.min);
const headSize = new THREE.Vector3().subVectors(gb.max, gb.min);
const geomExtent = Math.max(headSize.x, headSize.y, headSize.z) || 1;

/**
 * Make a shell mesh move with the head.
 *
 * three builds a fresh `morphTargetDictionary` for every mesh out of the
 * geometry's morph attributes, and those carry no names — so a hand-built mesh
 * over shared geometry gets the keys '0', '1', '2'. Every lookup by morph name
 * returns undefined and the shell sits frozen in the neutral pose while the
 * face moves under it. Sharing the influences ARRAY leaves nothing to keep in
 * sync; the same geometry means the same target order by construction.
 */
function shareMorphs(source, shell) {
  shell.morphTargetDictionary = source.morphTargetDictionary;
  shell.morphTargetInfluences = source.morphTargetInfluences;
}

// ---------------------------------------------------------------- hair -----
const headCentre = new THREE.Vector3().addVectors(gb.min, gb.max).multiplyScalar(0.5);

const HU = {
  uThickness: { value: 0.2 }, uLow: { value: 0.3 },
  uHeadCentre: { value: headCentre },
  uBase: { value: 1 }, uFront: { value: 0 }, uSide: { value: 0 }, uBack: { value: 0 },
  uStrip: { value: 0 }, uStripW: { value: 0.2 }, uFrizz: { value: 0 },
  uFade: { value: 0 }, uFadeY: { value: 0.6 },
  uPart: { value: 0 }, uPartX: { value: 0 },
  uWave: { value: 0 }, uRows: { value: 0 },
  uLift: { value: new THREE.Vector2(0, 0) },
  uHeadMin: { value: headMin }, uHeadSize: { value: headSize },
};

const HAIR_VERT_HEAD = `
attribute float _scalp;
varying float vAmt;
varying float vCov;
varying vec3 vHairP;
uniform float uThickness, uLow, uBase, uFront, uSide, uBack, uStrip, uStripW, uFrizz;
uniform float uFade, uFadeY, uPart, uPartX, uWave, uRows;
uniform vec2 uLift;
uniform vec3 uHeadMin, uHeadSize, uHeadCentre;
vec3 vHairDir;
float vHairAmt;
float hnoise(vec3 p){ return 0.5 + 0.5 * sin(p.x * 6.1) * sin(p.y * 5.3) * sin(p.z * 4.7); }
`;
const HAIR_VERT_BODY = `
  vHairP = position;
  vec3 f = (position - uHeadMin) / max(uHeadSize, vec3(1e-4));
  float fz = f.z;                              // 0 nape, 1 forehead
  float fy = f.y;                              // 0 collar, 1 crown
  float fx = abs(f.x - 0.5) * 2.0;             // 0 centre, 1 side
  float sx = (f.x - 0.5) * 2.0;                // -1 left .. +1 right
  // Edges measured against the range the scalp field actually occupies, not
  // against the head box: hair reaches fx 0.74, fy 0.47, fz 0.02..0.88, so the
  // old smoothstep(0.40, 0.95, fx) topped out at 0.44 and every side-weighted
  // style — undercut, fade, flat top — was quietly running at half strength.
  float wFront = smoothstep(0.45, 0.85, fz);
  float wSide  = smoothstep(0.20, 0.68, fx);
  float wBack  = 1.0 - smoothstep(0.10, 0.50, fz);
  // COVERAGE AND VOLUME ARE SEPARATE.
  //
  // They used to be one number: the region weights multiplied the coverage
  // ramp, so a front weight of 0.5 did not thicken the fringe, it pushed the
  // whole coverage curve down and dragged the hairline onto the eyebrows. Every
  // style with any front or side weight — most of them — grew a low mask of a
  // forehead. Volume now scales thickness only; a region weight BELOW one still
  // takes hair away, by lifting the coverage threshold, which is what an
  // undercut or a fade actually does.
  float region = clamp(uBase + uFront * wFront + uSide * wSide + uBack * wBack, 0.0, 2.5);
  float lowHere = uLow + 0.30 * (1.0 - min(region, 1.0));
  // A 0.16-wide ramp, not 0.10: the coverage boundary is where the shell rises
  // off the skull, and a short ramp turns that rise into a visible overhanging
  // lip all the way round the cut — the brim of the mushroom.
  float cov = smoothstep(lowHere, lowHere + 0.16, _scalp);

  // Carving. Everything here REMOVES hair, so it multiplies coverage: thickness
  // must reach zero wherever the hair does, or the shell keeps a floating rim
  // where it was cut away.
  //
  // TAPER FADE. Short at the bottom of the sides, blending up into the full
  // length. Confined to the sides by wSide, because a fade that reaches the
  // front is a receding hairline rather than a barber's cut.
  cov *= mix(1.0, smoothstep(uFadeY - 0.08, uFadeY + 0.18, fy), uFade * wSide);
  // PARTING. A narrow valley through the mass, off-centre for a side part and
  // at zero for curtains. Only forward of the crown — a parting that runs all
  // the way to the nape looks like a scar.
  cov *= 1.0 - uPart
       * (1.0 - smoothstep(0.0, 0.11, abs(sx - uPartX)))
       * smoothstep(0.30, 0.68, fz);
  // Centre strip for a mohawk: everything outside the strip goes to zero.
  cov *= mix(1.0, 1.0 - smoothstep(uStripW, uStripW + 0.22, fx), uStrip);
  // Cornrows: many strips instead of one, running front-to-back.
  cov *= 1.0 - uRows * 0.55 * (0.5 + 0.5 * cos(sx * 26.0));
  vCov = cov;

  float amt = cov * region;
  // Waves ride over the mass rather than replacing it, so a wavy cut keeps the
  // silhouette of the cut it is a variant of.
  amt *= 1.0 + uWave * 0.35 * sin(fy * 24.0 + fz * 6.0);
  // GLOBAL BACK TAPER. A uniform offset balloons the occipital region into a
  // smooth featureless dome that extends past the skull and catches the rim
  // light as a pale slab — the single thing that made every style read as a
  // helmet rather than hair. Real hair is thin at the nape and full at the
  // crown, so thickness follows front-to-back rather than being constant.
  amt *= 0.42 + 0.58 * smoothstep(0.05, 0.62, fz);
  // Frizz breaks a smooth shell into something that reads as curl rather than
  // a moulded cap; deterministic per vertex so it does not shimmer.
  amt *= 1.0 + uFrizz * (hnoise(position * 2.2) - 0.5);
  amt = clamp(amt, 0.0, 1.6);
  vAmt = amt;
  // Directional lift. A pompadour is not a thicker shell — it is the same mass
  // pushed up and forward at the front. Offsetting purely along the normal can
  // only ever inflate the skull, which is why every "voluminous" style used to
  // come out as a bigger helmet.
  //
  // The offset itself is applied AFTER the morphs — see HAIR_VERT_OFFSET.
  vHairDir = normalize(normalize(objectNormal) + vec3(0.0, uLift.y, uLift.x) * wFront * 1.4);
  vHairAmt = amt;
`;

/**
 * The offset, applied after `morphtarget_vertex`.
 *
 * `begin_vertex` runs BEFORE the morphs, and the NORMAL attribute carries no
 * morph deltas, so pushing the shell out there offsets it along the neutral
 * pose's normal and lets the morph rotate the surface out from under it. Rail
 * a few sliders and the skin punches through the hair in patches — rendering
 * the shell on its own showed it whole, which is what proves it is penetration
 * and not a hole in the coverage.
 *
 * A radial direction from the head centre is computed from the MORPHED position
 * and therefore follows the head. On a skull, convex nearly everywhere hair
 * grows, radial closely approximates the normal; keeping 40% of the real normal
 * preserves the silhouette detail that radial alone would flatten.
 */
const HAIR_VERT_OFFSET = `
  vec3 hRadial = normalize(transformed - uHeadCentre);
  transformed += normalize(mix(vHairDir, hRadial, 0.6)) * uThickness * vHairAmt;
`;

const hairMat = new THREE.MeshStandardMaterial({
  // Soft edge, set in `color_fragment` — BEFORE `alphatest_fragment`.
  //
  // The alpha used to be lowered in `dithering_fragment`, which runs after the
  // alpha test, so alphaTest never saw it: every fringe pixel survived and
  // blended with the background into a grey haze. Removing the fade fixed the
  // haze but left a hard jagged cut, which is why the hair read as a moulded
  // cap. Setting it here gets both — discarded below the threshold, feathered
  // just above it — and the band is narrow so only the last few pixels fade.
  color: 0x5A3A22, roughness: 0.80, metalness: 0, side: THREE.FrontSide,
  envMapIntensity: 1.15,
  // THE CUTOFF HAS TO LAND WHERE THE OFFSET IS ZERO.
  //
  // Offset and alpha are both driven by `amt`, so a cutoff at amt≈0.3 hid the
  // shell only after it had already lifted a third of its thickness off the
  // scalp: the hairline ended in a rim floating above the skull with daylight
  // under it, which is the gap between the hair and the head. Fading out by
  // amt≈0.04 puts the last visible pixel back on the skin.
  transparent: true, alphaTest: 0.06, depthWrite: true,
  // Coincident with the skin at that last pixel, so bias the hair forward
  // rather than let the depth test speckle along the hairline.
  polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
});
hairMat.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, HU);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>' + HAIR_VERT_HEAD)
    .replace('#include <begin_vertex>', '#include <begin_vertex>' + HAIR_VERT_BODY)
    .replace('#include <morphtarget_vertex>', '#include <morphtarget_vertex>' + HAIR_VERT_OFFSET);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying float vAmt;\nvarying float vCov;\nvarying vec3 vHairP;')
    .replace('#include <color_fragment>', '#include <color_fragment>\n' +
      // A WIDE alpha ramp. Narrow was correct for killing the grey haze and
      // wrong for the hairline: the whole transition happened inside a coverage
      // band 0.04 wide, so the visible boundary was effectively a hard isoline
      // and interpolating it across triangles gave the fringe a sawtooth edge.
      // Feathering over half the coverage range reads as hair thinning out.
      'diffuseColor.a *= smoothstep(0.02, 0.55, vCov);\n' +
      // Strand break-up. A shell lit as one smooth surface is the last thing
      // that says "moulded plastic"; a fine ripple in tone and roughness gives
      // the specular something to catch and costs two sines.
      // Strand break-up lives in ROUGHNESS ONLY — see below. Tinting the diffuse
      // by the same pattern turned the cap into corduroy: the eye reads a
      // regular light/dark banding as ribbing in the surface, while the same
      // pattern in the specular alone reads as separate strands catching light.
      'float strand = 0.55 * sin(vHairP.x * 233.0)\n' +
      '             + 0.27 * sin(vHairP.x * 97.0 + vHairP.z * 11.0)\n' +
      '             + 0.18 * sin(vHairP.x * 61.0 - vHairP.y * 29.0);\n' +
      // Roots darker than tips. A single flat colour is most of what makes an
      // offset shell read as a plastic cap rather than as hair.
      'diffuseColor.rgb *= 0.62 + 0.52 * smoothstep(0.06, 1.10, vAmt);')
    .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n' +
      'roughnessFactor = clamp(roughnessFactor - 0.16 * strand, 0.05, 1.0);');
};
const hair = new THREE.Mesh(parts.skin.geometry, hairMat);
// Drawn after the skin. The shell is strictly outside it, so back-to-front is
// simply skin-then-hair and no per-triangle sorting is needed.
hair.renderOrder = 1;
shareMorphs(parts.skin, hair);
parts.skin.parent.add(hair);

/**
 * frac is a FRACTION of head size — absolute values tore the shell into spikes.
 *
 * LENGTH IS COVERAGE, NOT THICKNESS. The shell is a hollow open-bottomed cap:
 * while it hugs the skull it reads as hair on a head, and the moment it balloons
 * past the silhouette you see its rim and unlit interior as a flat grey plate.
 * So thickness stays small for every style and "longer" means a lower `low`,
 * which is a threshold on the baked hairline coordinate — 0.60 is the hairline
 * itself, above it is scalp, below it runs down the sides and back of the head.
 */
const HAIR = {
  bald:         null,
  buzz:         { frac: 0.020, low: 0.68, base: 1.0 },
  crew:         { frac: 0.026, low: 0.64, base: 1.0, front: 0.20, side: -0.30 },
  short:        { frac: 0.032, low: 0.60, base: 1.0 },
  fringe:       { frac: 0.036, low: 0.56, base: 1.0, front: 0.50 },
  medium:       { frac: 0.040, low: 0.48, base: 1.0 },
  long:         { frac: 0.042, low: 0.16, base: 1.0, back: 0.25 },
  ponytail:     { frac: 0.036, low: 0.30, base: 1.0, back: 0.35, side: -0.45 },
  bun:          { frac: 0.034, low: 0.42, base: 1.0, back: 0.30, side: -0.35 },
  afro:         { frac: 0.052, low: 0.58, base: 1.15, frizz: 0.20 },
  curls:        { frac: 0.044, low: 0.52, base: 1.10, frizz: 0.35 },
  mohawk:       { frac: 0.058, low: 0.56, base: 1.15, strip: 1, stripW: 0.13 },
  undercut:     { frac: 0.036, low: 0.58, base: 1.0, side: -1.20 },
  quiff:        { frac: 0.040, low: 0.60, base: 0.90, front: 0.70, side: -0.50, lift: [0.10, 0.55] },
  receding:     { frac: 0.028, low: 0.74, base: 1.0 },
  // The everyday cuts. The first fifteen were shape experiments and several are
  // things nobody asks a barber for; these are what people actually wear, and
  // they are separated by PART, FADE and LIFT rather than by thickness — which
  // is why they no longer read as one haircut at four lengths.
  sidePart:     { frac: 0.034, low: 0.58, part: 0.60, partX: -0.34, side: -0.25 },
  combOver:     { frac: 0.038, low: 0.56, part: 0.45, partX: -0.46, side: -0.35, lift: [0.30, 0.10] },
  slickBack:    { frac: 0.032, low: 0.58, front: -0.10, lift: [-0.55, 0.30] },
  pompadour:    { frac: 0.044, low: 0.60, front: 0.60, side: -0.60, lift: [0.15, 0.85] },
  caesar:       { frac: 0.030, low: 0.60, front: 0.35, side: -0.25 },
  ivyLeague:    { frac: 0.032, low: 0.58, front: 0.30, side: -0.40, fade: 0.6, fadeY: 0.74 },
  taperFade:    { frac: 0.034, low: 0.54, fade: 1.0, fadeY: 0.78 },
  highFade:     { frac: 0.038, low: 0.54, fade: 1.0, fadeY: 0.86 },
  buzzFade:     { frac: 0.022, low: 0.62, fade: 1.0, fadeY: 0.82 },
  texturedCrop: { frac: 0.038, low: 0.58, front: 0.45, side: -0.55, frizz: 0.30 },
  messy:        { frac: 0.042, low: 0.52, frizz: 0.50, lift: [0.05, 0.20] },
  bowl:         { frac: 0.038, low: 0.54, front: 0.55, side: 0.25 },
  curtains:     { frac: 0.042, low: 0.50, front: 0.55, part: 0.70, partX: 0.0 },
  layered:      { frac: 0.042, low: 0.34, back: 0.15, wave: 0.30 },
  bob:          { frac: 0.040, low: 0.30, side: 0.25, back: 0.10 },
  pixie:        { frac: 0.032, low: 0.56, side: -0.35, frizz: 0.20, part: 0.35, partX: -0.40 },
  spiky:        { frac: 0.042, low: 0.60, frizz: 0.80, lift: [0.0, 0.50] },
  flatTop:      { frac: 0.048, low: 0.62, side: -0.90, lift: [0.0, 0.40] },
  wavy:         { frac: 0.042, low: 0.44, wave: 0.55 },
  cornrows:     { frac: 0.026, low: 0.58, rows: 1 },
};
window.__hairNames = Object.keys(HAIR);
window.__setHair = (name) => {
  const s = HAIR[name];
  hair.visible = !!s;
  if (s) {
    HU.uThickness.value = s.frac * geomExtent;
    HU.uLow.value = s.low;
    HU.uBase.value = s.base ?? 1;
    HU.uFront.value = s.front ?? 0;
    HU.uSide.value = s.side ?? 0;
    HU.uBack.value = s.back ?? 0;
    HU.uStrip.value = s.strip ?? 0;
    HU.uStripW.value = s.stripW ?? 0.2;
    HU.uFrizz.value = s.frizz ?? 0;
    HU.uFade.value = s.fade ?? 0;
    HU.uFadeY.value = s.fadeY ?? 0.6;
    HU.uPart.value = s.part ?? 0;
    HU.uPartX.value = s.partX ?? 0;
    HU.uWave.value = s.wave ?? 0;
    HU.uRows.value = s.rows ?? 0;
    HU.uLift.value.set(...(s.lift ?? [0, 0]));
  }
  renderer.render(scene, camera);
};

// -------------------------------------------------------------- beard ------
const BU = {
  uThickness: { value: 0.02 },
  uDensity: { value: 1 },
  uHeadCentre: { value: headCentre },
  uMix: { value: new THREE.Vector3(1, 1, 1) },
  uFrizz: { value: 0.2 },
};
const beardMat = new THREE.MeshStandardMaterial({
  color: 0x241610, roughness: 0.86, metalness: 0, side: THREE.FrontSide,
  envMapIntensity: 0.9,
  transparent: true, alphaTest: 0.12, depthWrite: true,
});
beardMat.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, BU);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', `#include <common>
attribute vec3 _beard;
varying float vAmt;
uniform float uThickness, uFrizz, uDensity;
uniform vec3 uMix, uHeadCentre;
vec3 vBeardDir;
float vBeardAmt;
float bnoise(vec3 p){ return 0.5 + 0.5 * sin(p.x * 15.0) * sin(p.y * 13.0) * sin(p.z * 11.0); }`)
    .replace('#include <begin_vertex>', `#include <begin_vertex>
  // Three baked weights — moustache, chin, jaw — selected by uMix. The five
  // styles are subsets of one region, so one bake serves all of them.
  float amt = clamp(dot(_beard, uMix), 0.0, 1.0);
  amt *= 1.0 + uFrizz * (bnoise(position * 3.0) - 0.5);
  vAmt = amt;
  vBeardDir = normalize(objectNormal);
  vBeardAmt = amt;`)
    // After the morphs, for the reason given on the hair shell.
    .replace('#include <morphtarget_vertex>', `#include <morphtarget_vertex>
  vec3 bRadial = normalize(transformed - uHeadCentre);
  transformed += normalize(mix(vBeardDir, bRadial, 0.45)) * uThickness * vBeardAmt;`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\n' +
      'varying float vAmt;\nuniform float uDensity;')
    .replace('#include <color_fragment>', '#include <color_fragment>\n' +
      // Wider feather than the hair: a beard has no edge in reality, it thins
      // out, and a hard boundary along the jaw looks painted on.
      'diffuseColor.a *= smoothstep(0.04, 0.52, vAmt);\n' +
      // Stipple rather than a uniform fade: lowering alpha evenly gives a grey
      // beard, dropping individual specks gives a sparse one, and sparse is
      // what stubble is.
      // A FLAT alpha, not a stipple — see the note in FaceRenderer. Every
      // periodic function the eye can find the period of reads as fabric, and
      // a five-o'clock shadow is a tint rather than visible follicles anyway.
      'diffuseColor.a *= uDensity;\n' +
      'diffuseColor.rgb *= 0.78 + 0.34 * smoothstep(0.05, 0.9, vAmt);');
};
const beard = new THREE.Mesh(parts.skin.geometry, beardMat);
beard.renderOrder = 1;
shareMorphs(parts.skin, beard);
parts.skin.parent.add(beard);

/** DENSITY IS NOT THICKNESS — see the note in FaceRenderer's BEARD_SPEC. */
const BEARD = {
  none:       null,
  stubble:    { frac: 0.005, mix: [1, 1, 1], frizz: 0.5, density: 0.40 },
  moustache:  { frac: 0.016, mix: [1, 0, 0], frizz: 0.2, density: 0.94 },
  goatee:     { frac: 0.018, mix: [1, 1, 0], frizz: 0.25, density: 0.94 },
  full:       { frac: 0.024, mix: [1, 1, 1], frizz: 0.3, density: 1.0 },
};
window.__beardNames = Object.keys(BEARD);
window.__setBeard = (name) => {
  const s = BEARD[name];
  beard.visible = !!s;
  if (s) {
    BU.uThickness.value = s.frac * geomExtent;
    BU.uMix.value.set(...s.mix);
    BU.uFrizz.value = s.frizz;
    BU.uDensity.value = s.density ?? 1;
  }
  renderer.render(scene, camera);
};

// eyes
parts.sclera.material = (() => {
  const m = new THREE.MeshPhysicalMaterial({
    color: 0xdedbd6, roughness: 0.18, metalness: 0,
    clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 0.75 });
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float _irisr;\nvarying float vR;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvR = _irisr;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vR;')
      .replace('#include <color_fragment>', '#include <color_fragment>\n' +
        'float r = vR;\n' +
        'diffuseColor.rgb = mix(vec3(0.010), diffuseColor.rgb, smoothstep(0.40, 0.50, r));\n' +
        'diffuseColor.rgb *= 0.90 + 0.10 * smoothstep(3.2, 1.2, r);\n' +
        'diffuseColor.rgb *= mix(0.72, 1.0, smoothstep(1.0, 1.55, r));');
  };
  return m;
})();
parts.iris.material = (() => {
  const m = new THREE.MeshPhysicalMaterial({
    color: 0x4a6b8a, roughness: 0.12, metalness: 0,
    clearcoat: 0.9, clearcoatRoughness: 0.16, envMapIntensity: 0.35 });
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float _irisr;\nvarying float vR;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvR = _irisr;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vR;')
      .replace('#include <color_fragment>', '#include <color_fragment>\n' +
        'if (vR > 1.02) discard;\n' +
        'float r = vR;\n' +
        'float pupil = smoothstep(0.34, 0.50, r);\n' +
        'float limbal = smoothstep(1.02, 0.86, r);\n' +
        'float fibre = 0.88 + 0.12 * sin(r * 34.0);\n' +
        'diffuseColor.rgb *= pupil * limbal * fibre * (1.52 - 0.52 * r);\n' +
        'if (r < 0.33) discard;');
  };
  return m;
})();

// framing — neutral pose only, see FaceRenderer for why setFromObject is wrong
const holder = new THREE.Group();
holder.add(gltf.scene);
gltf.scene.updateWorldMatrix(true, true);
const box = new THREE.Box3()
  .setFromBufferAttribute(parts.skin.geometry.getAttribute('position'))
  .applyMatrix4(parts.skin.matrixWorld);
const size = box.getSize(new THREE.Vector3());
const centre = box.getCenter(new THREE.Vector3());
// HEADROOM. The frame is 2 * 6.2 * tan(14°) ≈ 3.09 units tall, so its top edge
// is at y = 1.545. A 2.35-unit head biased up by 0.30 (plus the root's 0.12) put
// the crown at 1.60 and the hair above that — every render sliced the top of the
// skull off, and a haircut you only ever see the bottom half of reads as a
// beret. Place the crown at a fixed height instead of biasing the centre, so the
// margin is a stated number rather than a leftover.
const s = 2.45 / Math.max(size.x, size.y, size.z);
holder.scale.setScalar(s);
const CROWN_Y = 1.10;
holder.position.set(
  -centre.x * s,
  CROWN_Y - (box.max.y - centre.y) * s - root.position.y,
  -centre.z * s,
);
root.add(holder);

// Render the shell WITHOUT the head. The decisive diagnostic for this technique:
// on a head, a hollow open-bottomed cap and a solid one look the same until they
// don't, and the difference is what makes a style read as hair or as plastic.
window.__debugHairOnly = (on) => {
  for (const p of Object.values(parts)) p.visible = !on;
  hair.visible = true;
  renderer.render(scene, camera);
};

/**
 * Drive one morph, on every primitive.
 *
 * Every primitive carries the full morph set, and driving only the skin widens
 * the face while leaving the eyeballs behind in the old sockets. Signed, because
 * these targets are linear combinations of a PCA basis: -1 is as real a face as
 * +1, and rendering only the positive half hides half of every axis.
 */
/** Show one primitive at a time. Which surface is actually visible where is a
 *  question about depth order, and no amount of measuring answers it. */
window.__onlyPart = (name) => {
  for (const [k, m] of Object.entries(parts)) m.visible = !name || k === name;
  if (name) { hair.visible = false; beard.visible = false; }
  renderer.render(scene, camera);
};

/**
 * A randomised face, driven exactly as the app drives one.
 *
 * Deterministic per seed, so a face worth arguing about can be looked at twice.
 * The distribution is normal-ish rather than uniform: this is a PCA space, and
 * uniform coefficients spend most of their time in its corners — faces a real
 * skull could produce, but not ones anybody would call ordinary.
 *
 * The values are drawn ONCE and then written to every primitive, because
 * drawing per mesh would give the skin one face, the eyes another and the hair
 * a third.
 */
window.__randomFace = (seed, spread = 1) => {
  let state = ((seed + 1) * 2654435761) % 4294967296;
  const rnd = () => { state = (state * 1103515245 + 12345) % 2147483648; return state / 2147483648; };
  // Sum of three uniforms: approximately normal, and bounded, so no draw ever
  // lands outside the rails and gets silently clamped into a duplicate face.
  const gauss = () => ((rnd() + rnd() + rnd() - 1.5) / 1.5) * spread;

  const names = window.__morphNames ?? [];
  const values = new Map(names.map((n) => [n, Math.max(-1, Math.min(1, gauss()))]));
  for (const mesh of [parts.skin, parts.sclera, parts.iris, hair, beard]) {
    const dict = mesh?.morphTargetDictionary;
    const inf = mesh?.morphTargetInfluences;
    if (!dict || !inf) continue;
    inf.fill(0);
    for (const [name, value] of values) {
      const i = dict[name];
      if (i !== undefined) inf[i] = value;
    }
  }
  renderer.render(scene, camera);
};

window.__morphNames = parts.skin.morphTargetDictionary
  ? Object.keys(parts.skin.morphTargetDictionary)
  : [];
window.__setMorph = (name, value) => {
  for (const m of [parts.skin, parts.sclera, parts.iris, hair, beard]) {
    const dict = m?.morphTargetDictionary;
    const inf = m?.morphTargetInfluences;
    if (!dict || !inf) continue;
    inf.fill(0);
    const i = dict[name];
    if (i !== undefined) inf[i] = value;
  }
  renderer.render(scene, camera);
};

window.__probeMorphs = () => ({
  skinDict: Object.keys(parts.skin.morphTargetDictionary ?? {}).slice(0, 4),
  hairDict: Object.keys(hair.morphTargetDictionary ?? {}).slice(0, 4),
  hairInfluences: hair.morphTargetInfluences?.length ?? null,
  skinInfluences: parts.skin.morphTargetInfluences?.length ?? null,
});

window.__probe = () => {
  const g = parts.skin.geometry;
  const a = g.getAttribute('position');
  const n = parts.skin.matrixWorld.clone();
  return {
    attr: `${a.array.constructor.name} normalized=${a.normalized}`,
    geomBox: [gb.min.toArray(), gb.max.toArray()],
    geomExtent,
    thickness: HU.uThickness.value,
    nodeScale: parts.skin.parent.scale.toArray(),
    holderScale: holder.scale.toArray(),
    world: n.elements.slice(0, 3),
  };
};

// Hair colour, for checking the face against the whole palette rather than
// against the one brown everything defaults to.
window.__setHairColor = (hex) => {
  hairMat.color.set(hex);
  beardMat.color.set(hex).multiplyScalar(0.72);
  // Brows follow the hair: desaturated a third of the way toward their own
  // luminance, then darkened. Scaling the hair colour alone keeps its full
  // saturation, and a dark saturated orange skews yellow-green through ACES —
  // every blonde character came out with olive eyebrows.
  const b = SU.uBrowColor.value.set(hex);
  const bl = 0.3 * b.r + 0.59 * b.g + 0.11 * b.b;
  b.lerp(new THREE.Color(bl, bl, bl), 0.22).multiplyScalar(0.56);
  renderer.render(scene, camera);
};
if (q.get('haircol')) window.__setHairColor(q.get('haircol'));

// Iris colour, to check the palette actually reads on the new eye shader.
window.__setEyeColor = (hex) => { parts.iris.material.color.set(hex); renderer.render(scene, camera); };
if (q.get('eyecol')) window.__setEyeColor(q.get('eyecol'));

// Skin tone. The palette spans porcelain to darkest, and the exposure that
// flatters one end can crush the other — which is the failure that forced the
// scanned head's whole lighting rig to be re-tuned once already.
window.__setSkin = (hex) => {
  const m = parts.skin.material;
  m.color.set(hex);
  // Environment weight scales with darkness — see FaceRenderer. Diffuse falls
  // with albedo and specular does not, so a deep tone under a rig tuned for a
  // pale one loses its form entirely.
  const lum = 0.3 * m.color.r + 0.59 * m.color.g + 0.11 * m.color.b;
  m.envMapIntensity = 0.45 + 0.55 * (1 - Math.min(1, lum * 1.6));
  renderer.render(scene, camera);
};
if (q.get('skin')) window.__setSkin(q.get('skin'));

window.__setHair('short');
window.__setBeard('none');
renderer.render(scene, camera);
window.__ok = true;
</script></body></html>
